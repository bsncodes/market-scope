name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Prettier and oxlint both scan from the repo root, so these two cover every
  # workspace plus root-level files. Splitting them per workspace would lose
  # docker-compose.yml, the workflows and the README.
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run format:check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run lint

  # Per workspace so a failure names the package. fail-fast is off so one
  # broken workspace does not hide the state of the other.
  typecheck:
    name: Typecheck (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        workspace: [api, app]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run typecheck --workspace ${{ matrix.workspace }}

  build:
    name: Build (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        workspace: [api, app]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run build --workspace ${{ matrix.workspace }}

  # Integration tests hit a real PostGIS instance: the geography columns,
  # spatial functions and CHECK constraints are exactly what they assert, so a
  # stub or sqlite would test nothing that matters. Geocoding is stubbed
  # in-process, so nothing here reaches the real Nominatim.
  test:
    name: Test (api)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: market_scope_test
          POSTGRES_USER: market_scope
          POSTGRES_PASSWORD: market_scope
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U market_scope -d market_scope_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

    env:
      DATABASE_URL: postgres://market_scope:market_scope@localhost:5432/market_scope_test

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Apply migrations and seed reference data
        run: npm run init:setup --workspace api

      - run: npm test --workspace api
