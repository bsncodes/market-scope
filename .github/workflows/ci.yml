name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Prettier and oxlint both scan from the repo root, so these two cover every
  # workspace plus root-level files. Splitting them per workspace would lose
  # docker-compose.yml, the workflows and the README.
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run format:check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run lint

  # Per workspace so a failure names the package. fail-fast is off so one
  # broken workspace does not hide the state of the other.
  typecheck:
    name: Typecheck (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        workspace: [api, app]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run typecheck --workspace ${{ matrix.workspace }}

  build:
    name: Build (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        workspace: [api, app]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run build --workspace ${{ matrix.workspace }}

  # Pure logic — CSV parsing, coordinate validation, param coercion. No
  # database, so this reports in seconds and a failure here is unambiguously a
  # logic regression rather than an environment problem.
  test-unit:
    name: Test unit (api)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Never connected to. config.ts requires DATABASE_URL to be present, and
    # the unit specs reach src/db transitively through the controller, but pg
    # opens no socket until something issues a query — and none of them do.
    env:
      DATABASE_URL: postgres://unused:unused@127.0.0.1:1/unused

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run test:unit --workspace api

  # Runs against real PostGIS: the geography columns, ST_MakePoint ordering and
  # CHECK constraints are exactly what these assert, so a stub or sqlite would
  # verify nothing that matters. Geocoding is stubbed in-process, so nothing
  # here reaches the real Nominatim.
  test-integration:
    name: Test integration (api)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: market_scope_test
          POSTGRES_USER: market_scope
          POSTGRES_PASSWORD: market_scope
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U market_scope -d market_scope_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

    env:
      DATABASE_URL: postgres://market_scope:market_scope@localhost:5432/market_scope_test

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Apply migrations and seed reference data
        run: npm run init:setup --workspace api

      # Fails loudly if the suite silently stops covering the database, rather
      # than reporting green on zero integration tests.
      - name: Verify integration specs exist
        run: |
          count=$(find api/test/integration -name '*.test.ts' | wc -l)
          echo "integration spec files: $count"
          test "$count" -gt 0

      - run: npm run test:integration --workspace api
